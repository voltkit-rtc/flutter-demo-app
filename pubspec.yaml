name: voltkit_live
description: "VoltKit Live: a Flutter demo of live video and audio rooms, 1v1 calls, chat and SVGA gifts on VoltKit RTC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  voltkit_rtc: ^0.9.17
  flutter_webrtc: ^1.6.3
  flutter_svga: ^0.0.14
  socket_io_client: ^3.1.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  permission_handler: 12.0.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2

# flutter_webrtc 1.6.3 with one fix: its Android video renderer gets an alpha channel. Without it, Impeller (on in
# release builds) shows the room background through the video on some phones. See third_party/flutter_webrtc/PATCHED.md.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/avatars/
    - assets/brand/
    - assets/covers/
    - assets/gifts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit_800ExtraBold.ttf
          weight: 800
    - family: Ionicons
      fonts:
        - asset: assets/fonts/Ionicons.ttf
